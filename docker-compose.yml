services:
  postgres:
    image: postgres:16-alpine
    container_name: foodresq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodresq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: foodresq123
    ports:
      - "5433:5432"
    volumes:
      - foodresq-pgdata:/var/lib/postgresql/data

volumes:
  foodresq-pgdata:
