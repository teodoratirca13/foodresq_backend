spring.application.name=foodresq

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# JWT (Base64-encoded secret >= 32 bytes; OVERRIDE in production via env var)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS}

# CORS
# Comma-separated list of additional allowed origins (beyond http://localhost:3000 which is always allowed)
# Example: https://your-frontend.vercel.app,https://another-origin.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}